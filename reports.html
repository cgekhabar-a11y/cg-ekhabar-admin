<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — CG ई खबर Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>CG ई खबर</h2>
                <p>Ad Manager</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="ads.html" class="nav-item">📢 Advertisements</a>
                <a href="ads.html?filter=active" class="nav-item nav-sub">• Active</a>
                <a href="ads.html?filter=scheduled" class="nav-item nav-sub">• Scheduled</a>
                <a href="ads.html?filter=expired" class="nav-item nav-sub">• Expired</a>
                <a href="ads.html?filter=paused" class="nav-item nav-sub">• Paused</a>
                <a href="add-ad.html" class="nav-item nav-sub">+ Add Advertisement</a>
                <a href="reports.html" class="nav-item active">📈 Reports</a>
                <a href="#" class="nav-item nav-logout" onclick="handleLogout(); return false;">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h1>Reports</h1>
                </div>
            </div>

            <!-- OVERALL STATS -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Impressions</div>
                    <div class="stat-value" id="reportImpressions">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Clicks</div>
                    <div class="stat-value" id="reportClicks">—</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-label">Overall CTR</div>
                    <div class="stat-value" id="reportCTR">—</div>
                </div>
            </div>

            <!-- AD-WISE TABLE -->
            <div class="card">
                <div class="card-title">📊 Advertisement-wise Performance</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Advertiser</th>
                                <th>Campaign</th>
                                <th>Screen</th>
                                <th>Impressions</th>
                                <th>Clicks</th>
                                <th>CTR</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="reportsTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 32px;">
                                    Loading...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
