<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Advertisement — CG ई खबर Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>CG ई खबर</h2>
                <p>Ad Manager</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="ads.html" class="nav-item">📢 Advertisements</a>
                <a href="ads.html?filter=active" class="nav-item nav-sub">• Active</a>
                <a href="ads.html?filter=scheduled" class="nav-item nav-sub">• Scheduled</a>
                <a href="ads.html?filter=expired" class="nav-item nav-sub">• Expired</a>
                <a href="ads.html?filter=paused" class="nav-item nav-sub">• Paused</a>
                <a href="add-ad.html" class="nav-item nav-sub">+ Add Advertisement</a>
                <a href="reports.html" class="nav-item">📈 Reports</a>
                <a href="#" class="nav-item nav-logout" onclick="handleLogout(); return false;">🚪 Logout</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h1>Edit Advertisement</h1>
                </div>
                <div class="user-info">
                    <a href="ads.html" class="btn-secondary" style="text-decoration: none;">← Back</a>
                </div>
            </div>

            <form id="editAdForm" class="card">
                <div class="card-title">✏️ Edit Advertisement</div>

                <input type="hidden" id="adId">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Advertiser Name *</label>
                        <input type="text" id="advertiser_name" required>
                    </div>

                    <div class="form-group">
                        <label>Campaign Name</label>
                        <input type="text" id="campaign_name">
                    </div>

                    <div class="form-group full-width">
                        <label>Title *</label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="description" rows="3"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Current Banner</label>
                        <img id="currentBanner" class="image-preview" style="max-height: 150px;">

                        <label style="margin-top: 16px;">Change Banner (Optional — leave empty to keep current)</label>
                        <input type="file" id="bannerFile" accept="image/jpeg,image/jpg,image/png,image/webp">
                        <img id="bannerPreview" class="image-preview" style="display: none; max-height: 150px;">
                        <div id="uploadStatus" style="font-size: 12px; color: #666; margin-top: 8px;"></div>
                    </div>

                    <div class="form-group">
                        <label>Website URL</label>
                        <input type="url" id="click_url">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="phone">
                    </div>

                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="whatsapp">
                    </div>

                    <div class="form-group">
                        <label>Start Date *</label>
                        <input type="datetime-local" id="start_date" required>
                    </div>

                    <div class="form-group">
                        <label>End Date *</label>
                        <input type="datetime-local" id="end_date" required>
                    </div>

                    <div class="form-group">
                        <label>Screen *</label>
                        <select id="screen" required>
                            <option value="HOME">Home</option>
                            <option value="LATEST_NEWS">Latest News</option>
                            <option value="CATEGORY">Category</option>
                            <option value="DISTRICT_NEWS">District News</option>
                            <option value="SEARCH">Search</option>
                            <option value="NEWS_DETAIL">News Detail</option>
                            <option value="PROFILE">Profile</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Placement *</label>
                        <select id="placement" required>
                            <option value="TOP">Top</option>
                            <option value="MIDDLE">Middle</option>
                            <option value="BOTTOM">Bottom</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Priority</label>
                        <input type="number" id="priority" min="0" max="100">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <div style="display: flex; align-items: center; gap: 12px; padding-top: 8px;">
                            <label class="toggle-switch">
                                <input type="checkbox" id="active">
                                <span class="toggle-slider"></span>
                            </label>
                            <span id="activeLabel" style="font-weight: 600;">—</span>
                        </div>
                    </div>
                </div>

                <div id="formMessage" style="margin-top: 20px;"></div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" id="submitBtn" class="btn-primary">✅ Save Changes</button>
                    <a href="ads.html" class="btn-secondary" style="text-decoration: none; padding: 14px 24px;">Cancel</a>
                </div>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/edit-ad.js"></script>
</body>
</html>
