<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Advertisement — CG ई खबर Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>CG ई खबर</h2>
                <p>Ad Manager</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    📊 Dashboard
                </a>

                <a href="ads.html" class="nav-item">
                    📢 Advertisements
                </a>
                <a href="ads.html?filter=active" class="nav-item nav-sub">
                    • Active
                </a>
                <a href="ads.html?filter=scheduled" class="nav-item nav-sub">
                    • Scheduled
                </a>
                <a href="ads.html?filter=expired" class="nav-item nav-sub">
                    • Expired
                </a>
                <a href="ads.html?filter=paused" class="nav-item nav-sub">
                    • Paused
                </a>
                <a href="add-ad.html" class="nav-item nav-sub active">
                    + Add Advertisement
                </a>

                <a href="reports.html" class="nav-item">
                    📈 Reports
                </a>

                <a href="#" class="nav-item nav-logout" onclick="handleLogout(); return false;">
                    🚪 Logout
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP BAR -->
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h1>Add New Advertisement</h1>
                </div>
                <div class="user-info">
                    <a href="ads.html" class="btn-secondary" style="text-decoration: none;">
                        ← Back to Ads
                    </a>
                </div>
            </div>

            <!-- FORM -->
            <form id="addAdForm" class="card">
                <div class="card-title">📋 Advertisement Details</div>

                <div class="form-grid">
                    <!-- Advertiser Name -->
                    <div class="form-group">
                        <label>Advertiser Name *</label>
                        <input type="text" id="advertiser_name" required
                               placeholder="e.g., Om Patel">
                    </div>

                    <!-- Campaign Name -->
                    <div class="form-group">
                        <label>Campaign Name</label>
                        <input type="text" id="campaign_name"
                               placeholder="e.g., Diwali Sale 2026">
                    </div>

                    <!-- Title -->
                    <div class="form-group full-width">
                        <label>Title *</label>
                        <input type="text" id="title" required
                               placeholder="e.g., Diwali Special Offer — 50% Off">
                    </div>

                    <!-- Description -->
                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="description" rows="3"
                                  placeholder="e.g., सभी items पर 50% छूट, सिर्फ 15 नवंबर तक"></textarea>
                    </div>

                    <!-- Banner Image -->
                    <div class="form-group full-width">
                        <label>Banner Image * (JPG, PNG, WebP — Max 5 MB)</label>
                        <input type="file" id="bannerFile" accept="image/jpeg,image/jpg,image/png,image/webp" required>
                        <img id="bannerPreview" class="image-preview" style="display: none;">
                        <div id="uploadStatus" style="font-size: 12px; color: #666; margin-top: 8px;"></div>
                    </div>

                    <!-- Click URL -->
                    <div class="form-group">
                        <label>Website URL</label>
                        <input type="url" id="click_url"
                               placeholder="https://example.com">
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="phone"
                               placeholder="+919999999999">
                    </div>

                    <!-- WhatsApp -->
                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="whatsapp"
                               placeholder="+919999999999">
                    </div>

                    <!-- Start Date -->
                    <div class="form-group">
                        <label>Start Date *</label>
                        <input type="datetime-local" id="start_date" required>
                    </div>

                    <!-- End Date -->
                    <div class="form-group">
                        <label>End Date *</label>
                        <input type="datetime-local" id="end_date" required>
                    </div>

                    <!-- Screen -->
                    <div class="form-group">
                        <label>Screen *</label>
                        <select id="screen" required>
                            <option value="">Select Screen</option>
                            <option value="HOME">Home</option>
                            <option value="LATEST_NEWS">Latest News</option>
                            <option value="CATEGORY">Category</option>
                            <option value="DISTRICT_NEWS">District News</option>
                            <option value="SEARCH">Search</option>
                            <option value="NEWS_DETAIL">News Detail</option>
                            <option value="PROFILE">Profile</option>
                        </select>
                    </div>

                    <!-- Placement -->
                    <div class="form-group">
                        <label>Placement *</label>
                        <select id="placement" required>
                            <option value="">Select Placement</option>
                            <option value="TOP">Top</option>
                            <option value="MIDDLE">Middle</option>
                            <option value="BOTTOM">Bottom</option>
                        </select>
                    </div>

                    <!-- Priority -->
                    <div class="form-group">
                        <label>Priority (Higher = Shows first)</label>
                        <input type="number" id="priority" value="0" min="0" max="100">
                    </div>

                    <!-- Active Toggle -->
                    <div class="form-group">
                        <label>Status</label>
                        <div style="display: flex; align-items: center; gap: 12px; padding-top: 8px;">
                            <label class="toggle-switch">
                                <input type="checkbox" id="active" checked>
                                <span class="toggle-slider"></span>
                            </label>
                            <span id="activeLabel" style="font-weight: 600; color: #10B981;">Active</span>
                        </div>
                    </div>
                </div>

                <!-- Error/Success Messages -->
                <div id="formMessage" style="margin-top: 20px;"></div>

                <!-- Form Actions -->
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" id="submitBtn" class="btn-primary">
                        ✅ Save Advertisement
                    </button>
                    <a href="ads.html" class="btn-secondary" style="text-decoration: none; padding: 14px 24px;">
                        Cancel
                    </a>
                </div>
            </form>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/add-ad.js"></script>
</body>
</html>
